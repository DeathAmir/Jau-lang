name: jaux-package-fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jaux-package-fix-release.yml'
      - 'tools/apply_jaux_fix.py'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/apply_jaux_fix.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jau_part01.inc src/jauc_main.cpp src/jau_part03.inc tests/native_extension/src/main.jau docs/INTEROP.md
          git commit -m "Fix native package source/object separation and typed FFI annotations"
          git push origin HEAD:main

name: v081-native

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Jau x64
        run: |
          cmake -S . -B build -A x64 -DJAU_ENABLE_ASM_FASTOPS=OFF
          cmake --build build --config Release --parallel 2
      - name: Verify Jau 0.8.1
        shell: pwsh
        run: |
          $v = & .\build\Release\jauc.exe --version
          if ($v -ne "0.8.1") { throw "unexpected jauc version: $v" }
      - name: OBJ metadata to PE32+
        shell: pwsh
        run: |
          & .\build\Release\jauc.exe obj tests\entry_obj.jau -o entry.obj --target windows-x86_64 -O3
          if (!(Test-Path .\entry.obj.jmeta)) { throw "JAUMETA1 sidecar missing" }
          & .\build\Release\jauld.exe entry.obj -o entry.exe
          $lines = @(& .\entry.exe)
          if ($LASTEXITCODE -ne 0 -or $lines[0].Trim() -ne "42") { throw "metadata PE32+ regression failed: $lines" }
      - name: Entry fallback without metadata x64
        shell: pwsh
        run: |
          Remove-Item .\entry.obj.jmeta -Force
          & .\build\Release\jauld.exe entry.obj -o entry-fallback.exe --target windows-x86_64
          $lines = @(& .\entry-fallback.exe)
          if ($LASTEXITCODE -ne 0 -or $lines[0].Trim() -ne "42") { throw "fallback PE32+ regression failed: $lines" }
      - name: Jau 0.8.1 syntax native smoke x64
        shell: pwsh
        run: |
          & .\build\Release\jauc.exe native tests\v081_syntax.jau -o syntax-v081.exe --target windows-x86_64 -O3
          if ($LASTEXITCODE -ne 0) { throw "0.8.1 syntax x64 compile failed" }
          $out=@(& .\syntax-v081.exe)
          if(($out -join ',') -ne '10,157,-1'){ throw "0.8.1 syntax x64 mismatch: $out" }
          & .\build\Release\jauc.exe native tests\v081_namespace.jau -o ns-v081.exe --target windows-x86_64 -O3
          $ns=@(& .\ns-v081.exe)
          if(($ns -join ',') -ne '42'){ throw "0.8.1 namespace x64 mismatch: $ns" }
      - name: Stage x64 artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\stdlib,dist\tools,dist\docs | Out-Null
          Copy-Item build\Release\jauc.exe,build\Release\jur.exe,build\Release\jauas.exe,build\Release\jauld.exe,build\Release\jaupm.exe,build\Release\jau-setup.exe dist\
          Copy-Item stdlib\* dist\stdlib\
          Copy-Item tools\jaupm.jau dist\tools\
          Copy-Item docs\LANGUAGE.md,docs\LINKER.md,docs\PERFORMANCE.md,docs\PACKAGES.md,docs\NATIVE_EXTENSIONS.md,docs\INTEROP.md,docs\V080.md,docs\V081.md dist\docs\
          Copy-Item README.md dist\
      - uses: actions/upload-artifact@v4
        with:
          name: jau-0.8.1-windows-x64
          path: dist

  windows-x86:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Jau x86
        run: |
          cmake -S . -B build32 -A Win32 -DJAU_ENABLE_ASM_FASTOPS=OFF
          cmake --build build32 --config Release --parallel 2
      - name: Verify Jau 0.8.1 x86
        shell: pwsh
        run: |
          $v = & .\build32\Release\jauc.exe --version
          if ($v -ne "0.8.1") { throw "unexpected jauc version: $v" }
      - name: OBJ metadata to PE32
        shell: pwsh
        run: |
          & .\build32\Release\jauc.exe obj tests\entry_obj.jau -o entry32.obj --target windows-x86 -O3
          if (!(Test-Path .\entry32.obj.jmeta)) { throw "JAUMETA1 sidecar missing" }
          & .\build32\Release\jauld.exe entry32.obj -o entry32.exe
          $lines = @(& .\entry32.exe)
          if ($LASTEXITCODE -ne 0 -or $lines[0].Trim() -ne "42") { throw "metadata PE32 regression failed: $lines" }
      - name: Entry fallback without metadata x86
        shell: pwsh
        run: |
          Remove-Item .\entry32.obj.jmeta -Force
          & .\build32\Release\jauld.exe entry32.obj -o entry32-fallback.exe --target windows-x86
          $lines = @(& .\entry32-fallback.exe)
          if ($LASTEXITCODE -ne 0 -or $lines[0].Trim() -ne "42") { throw "fallback PE32 regression failed: $lines" }
      - name: Jau 0.8.1 syntax native smoke x86
        shell: pwsh
        run: |
          & .\build32\Release\jauc.exe native tests\v081_syntax.jau -o syntax-v081-x86.exe --target windows-x86 -O3
          if ($LASTEXITCODE -ne 0) { throw "0.8.1 syntax x86 compile failed" }
          $out=@(& .\syntax-v081-x86.exe)
          if(($out -join ',') -ne '10,157,-1'){ throw "0.8.1 syntax x86 mismatch: $out" }
          & .\build32\Release\jauc.exe native tests\v081_namespace.jau -o ns-v081-x86.exe --target windows-x86 -O3
          $ns=@(& .\ns-v081-x86.exe)
          if(($ns -join ',') -ne '42'){ throw "0.8.1 namespace x86 mismatch: $ns" }
      - name: Stage x86 artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist32\stdlib,dist32\tools,dist32\docs | Out-Null
          Copy-Item build32\Release\jauc.exe,build32\Release\jur.exe,build32\Release\jauas.exe,build32\Release\jauld.exe,build32\Release\jaupm.exe,build32\Release\jau-setup.exe dist32\
          Copy-Item stdlib\* dist32\stdlib\
          Copy-Item tools\jaupm.jau dist32\tools\
          Copy-Item docs\LANGUAGE.md,docs\LINKER.md,docs\PERFORMANCE.md,docs\PACKAGES.md,docs\NATIVE_EXTENSIONS.md,docs\INTEROP.md,docs\V080.md,docs\V081.md dist32\docs\
          Copy-Item README.md dist32\
      - uses: actions/upload-artifact@v4
        with:
          name: jau-0.8.1-windows-x86
          path: dist32

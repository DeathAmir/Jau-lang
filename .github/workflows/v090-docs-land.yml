name: v090-docs-land
on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_v090_docs.py'
      - 'tools/patch_v090_docs_apply.py'
      - '.github/workflows/v090-docs-land.yml'
permissions:
  contents: write
jobs:
  validate-and-land:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply docs/distribution patch
        shell: pwsh
        run: python tools/patch_v090_docs_apply.py
      - name: Build Jau x64
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DJAU_ENABLE_ASM_FASTOPS=OFF
          cmake --build build --config Release --parallel 2
          if(!(Test-Path .\build\Release\jaum.exe)){throw 'jaum.exe missing'}
      - name: Installer contains JauM
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force install-docs -ErrorAction SilentlyContinue
          & .\build\Release\jau-setup.exe --prefix "$PWD\install-docs" --source-root "$PWD" --no-path
          if(!(Test-Path .\install-docs\bin\jaum.exe)){throw 'jau-setup did not install jaum.exe'}
      - name: Build official Win32 GUI example object
        shell: pwsh
        run: |
          cmake -S examples\windows_gui -B gui-native -A x64
          cmake --build gui-native --config Release --parallel 2
          $obj=Get-ChildItem gui-native -Recurse -Filter window.cpp.obj | Select-Object -First 1
          if(!$obj){$obj=Get-ChildItem gui-native -Recurse -Filter window.obj | Select-Object -First 1}
          if(!$obj){throw 'GUI native object missing'}
          Copy-Item $obj.FullName examples\windows_gui\window.obj
          & .\build\Release\jauc.exe native examples\windows_gui\main.jau -o gui-example.exe --target windows-x86_64 --link examples\windows_gui\window.obj --system-lib user32 --subsystem windows --debug 2> gui-debug.txt
          if($LASTEXITCODE -ne 0){Get-Content gui-debug.txt;throw 'official GUI example failed to link'}
          if(!(Test-Path .\gui-example.exe)){throw 'GUI EXE missing'}
      - name: JauM GUI project produces same native link
        shell: pwsh
        run: |
          Copy-Item examples\windows_gui\jaum.txt jaum.txt
          & .\build\Release\jaum.exe build -f jaum.txt
          if($LASTEXITCODE -ne 0){throw 'JauM GUI build failed'}
          if(!(Test-Path .\build\jau-window-windows-x86_64.exe)){throw 'JauM GUI output missing'}
      - name: Documentation inventory and stale claims
        shell: pwsh
        run: |
          $required=@('docs\CLI.md','docs\TARGETS.md','docs\SYSTEM_LIBRARIES.md','docs\LIBRARIES.md','docs\JAUM.md','docs\HTTP_JSON.md','docs\WINDOWS_GUI.md','docs\V090.md','docs\LANGUAGE.md','docs\MAINTAINERS.md')
          foreach($f in $required){if(!(Test-Path $f)){throw "missing documentation: $f"}}
          if(!(Select-String README.md -Pattern 'Jau-0.9.0' -SimpleMatch -Quiet)){throw 'README version badge not updated'}
          if(Select-String README.md -Pattern 'Jau 0.7 highlights' -SimpleMatch -Quiet){throw 'README still contains stale 0.7 headline'}
      - name: Build workflow patch contains JauM staging
        shell: pwsh
        run: |
          $wf=Get-Content .github\workflows\build.yml -Raw
          if(!$wf.Contains('build/jaum')){throw 'Linux x64 build artifact does not include jaum'}
          if(!$wf.Contains('build32/jaum')){throw 'Linux x86 build artifact does not include jaum'}
          if(!$wf.Contains('build\Release\jaum.exe')){throw 'Windows x64 build artifact does not include jaum.exe'}
          if(!$wf.Contains('build32\Release\jaum.exe')){throw 'Windows x86 build artifact does not include jaum.exe'}
      - name: Existing regressions
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Land docs and installer integration
        shell: pwsh
        run: |
          git restore .github/workflows/build.yml
          git rm tools/patch_v090_docs.py tools/patch_v090_docs_apply.py .github/workflows/v090-docs-land.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs examples installer
          git commit -m "Jau 0.9: documentation, GUI example and installer integration"
          git push origin HEAD:main

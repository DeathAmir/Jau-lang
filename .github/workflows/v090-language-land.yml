name: v090-language-land
on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_v090_language.py'
      - '.github/workflows/v090-language-land.yml'
permissions:
  contents: write
jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply language patch
        run: python3 tools/patch_v090_language.py
      - name: Build Jau
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2
      - name: JSON and indexed assignment VM regression
        run: |
          ./build/jauc run tests/v090_json_index.jau > actual.txt
          cat > expected.txt <<'EOF'
          42
          true
          Jau
          9
          true
          DeathAmir
          [3,7]
          7
          array
          false
          a\nb\"c
          EOF
          diff -u expected.txt actual.txt
      - name: Bytecode round trip regression
        run: |
          ./build/jauc build tests/v090_json_index.jau -o json-index.jbc
          ./build/jur json-index.jbc > bytecode.txt
          diff -u expected.txt bytecode.txt
      - name: Invalid JSON returns diagnostic not crash
        run: |
          cat > invalid-json.jau <<'EOF'
          func main(){ print(json_get("{bad}", "x")); }
          EOF
          set +e
          ./build/jauc run invalid-json.jau > invalid.out 2> invalid.err
          code=$?
          set -e
          test $code -ne 0
          test -s invalid.err
          grep -q 'JSON' invalid.err
      - name: Indexed assignment bounds diagnostic
        run: |
          cat > invalid-index.jau <<'EOF'
          func main(){ let a=[1]; a[4]=9; }
          EOF
          set +e
          ./build/jauc run invalid-index.jau > /dev/null 2> bounds.err
          code=$?
          set -e
          test $code -ne 0
          grep -q 'array index out of range' bounds.err
      - name: Native compiler rejects VM-only containers safely
        run: |
          rm -f bad-native
          set +e
          ./build/jauc native tests/v090_json_index.jau -o bad-native --target linux-x86_64 > native.out 2> native.err
          code=$?
          set -e
          cat native.err
          test $code -ne 0
          test -s native.err
          test ! -f bad-native
      - name: Existing regressions
        run: ctest --test-dir build --output-on-failure
      - name: Land validated language changes
        run: |
          git rm tools/patch_v090_language.py .github/workflows/v090-language-land.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'Jau 0.9: JSON utilities and indexed array assignment'
          git push origin HEAD:main

name: v080-core-finalize
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v080-core-finalize.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply compiled 0.8 core patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          wf = Path('.github/workflows/v080-core-upgrade.yml')
          lines = wf.read_text(encoding='utf-8').splitlines()
          start = next((i for i, line in enumerate(lines) if line.strip() == "@'"), None)
          end = next((i for i, line in enumerate(lines) if "'@ | Set-Content -Encoding utf8 patch_v080.py" in line), None)
          if start is None or end is None or end <= start:
              raise SystemExit('embedded v0.8 patch script not found')
          body = []
          for line in lines[start + 1:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('patch_v080.py').write_text('\n'.join(body) + '\n', encoding='utf-8')
          '@ | Set-Content -Encoding utf8 extract_patch.py
          python extract_patch.py
          python patch_v080.py
          Remove-Item extract_patch.py,patch_v080.py -Force

          @'
          cmake_minimum_required(VERSION 3.16)
          project(MathAlias LANGUAGES CXX)
          add_library(mathx OBJECT mathx.cpp)
          '@ | Set-Content -Encoding utf8 tests\native_alias\CMakeLists.txt

          Remove-Item .github\workflows\v080-core-retry.yml -Force -ErrorAction SilentlyContinue
          Remove-Item .github\workflows\v080-core-finalize.yml -Force -ErrorAction SilentlyContinue

      - name: Build Jau 0.8 x64
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DJAU_ENABLE_ASM_FASTOPS=OFF
          cmake --build build --config Release --parallel 2
          $v = & .\build\Release\jauc.exe --version
          if ($v -ne '0.8.0') { throw "wrong Jau version: $v" }

      - name: Prove COFF symbol discovery and AOT aliasing
        shell: pwsh
        run: |
          cmake -S tests\native_alias -B aliasbuild -A x64
          cmake --build aliasbuild --config Release --parallel 2
          $obj = Get-ChildItem aliasbuild -Recurse -Filter mathx.obj | Select-Object -First 1
          if (!$obj) { throw 'mathx.obj not generated' }

          New-Item -ItemType Directory -Force aliaspkg\src,aliaspkg\native\windows-x86_64 | Out-Null
          Copy-Item tests\native_alias\jau.pkg aliaspkg\jau.pkg
          Copy-Item tests\native_alias\src\main.jau aliaspkg\src\main.jau
          Copy-Item $obj.FullName aliaspkg\native\windows-x86_64\mathx.obj

          $pm = (Resolve-Path .\build\Release\jaupm.exe).Path
          $jauc = (Resolve-Path .\build\Release\jauc.exe).Path
          Push-Location aliaspkg
          & $pm pack dist\MathAlias-1.0.0.jaux
          Pop-Location

          $env:JAU_HOME = "$PWD\alias-home"
          & $pm install .\aliaspkg\dist\MathAlias-1.0.0.jaux

          & $jauc asm tests\native_alias_consumer.jau -o alias.s --target windows-x86_64 --debug 2> alias-debug.txt
          if ($LASTEXITCODE -ne 0) { Get-Content alias-debug.txt; throw 'jauc asm failed' }
          if (!(Select-String -Path alias.s -Pattern 'call _mx_add' -Quiet)) { Get-Content alias.s; throw 'AOT did not use discovered _mx_add symbol' }
          if (!(Select-String -Path alias-debug.txt -Pattern '\[jauc:symbol\] _mx_add' -Quiet)) { Get-Content alias-debug.txt; throw 'debug trace did not expose _mx_add' }

          & $jauc native tests\native_alias_consumer.jau -o alias.exe --target windows-x86_64 --debug
          if ($LASTEXITCODE -ne 0) { throw 'jauc native failed' }
          $p = Start-Process .\alias.exe -PassThru
          if (!$p.WaitForExit(5000)) { Stop-Process -Id $p.Id -Force; throw 'native alias executable hung' }
          if ($p.ExitCode -ne 0) { throw "native alias executable failed: $($p.ExitCode)" }

          & $jauc check tests\native_alias_consumer.jau --target windows-x86_64 --debug
          if ($LASTEXITCODE -ne 0) { throw 'jauc check failed' }

      - name: Existing regression suite
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Commit validated 0.8 core
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Jau 0.8: resolve native COFF symbols in AOT and add debug diagnostics"
          git push origin HEAD:main

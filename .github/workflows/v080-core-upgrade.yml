name: v080-core-upgrade
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v080-core-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply core upgrade
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'anchor missing in {path}: {old[:100]!r}')
              s=s.replace(old,new,count)
              p.write_text(s,encoding='utf-8')

          # CompileOptions: native COFF symbols + debug/trace flag.
          replace('include/jau/jau.hpp',
                  '    std::vector<std::string> native_inputs;\n',
                  '    std::vector<std::string> native_inputs;\n    std::vector<std::string> native_symbols;\n    bool debug = false;\n')

          # VM trace support.
          replace('src/jau_part02b.inc',
                  'class VM {\n    Program p; std::vector<Value> globals,stack; struct Frame{int fn;size_t ip;std::vector<Value>locals;};std::vector<Frame> frames;\n',
                  'class VM {\n    Program p; std::vector<Value> globals,stack; struct Frame{int fn;size_t ip;std::vector<Value>locals;};std::vector<Frame> frames; bool trace=false;\n')
          replace('src/jau_part02b.inc',
                  '    explicit VM(Program x):p(std::move(x)),globals(p.globals.size()){}\n    Value run(){frames.push_back({0,0,std::vector<Value>(std::max(0,p.funcs[0].locals))});while(!frames.empty()){auto&fr=frames.back();auto&fn=p.funcs[fr.fn];if(fr.ip>=fn.code.size())throw Error("instruction pointer out of range");auto in=fn.code[fr.ip++];switch(in.op){\n',
                  '    explicit VM(Program x,bool t=false):p(std::move(x)),globals(p.globals.size()),trace(t){}\n    Value run(){frames.push_back({0,0,std::vector<Value>(std::max(0,p.funcs[0].locals))});while(!frames.empty()){auto&fr=frames.back();auto&fn=p.funcs[fr.fn];if(fr.ip>=fn.code.size())throw Error("instruction pointer out of range");size_t trace_ip=fr.ip;auto in=fn.code[fr.ip++];if(trace)std::cerr<<"[jau:trace] fn="<<fn.name<<" ip="<<trace_ip<<" op="<<(int)in.op<<" arg="<<in.a<<" stack="<<stack.size()<<" frames="<<frames.size()<<"\\n";switch(in.op){\n')

          # AOT resolves source extern names against real symbols discovered in COFF objects.
          replace('src/jau_part03.inc',
                  '    std::unordered_map<std::string,Stmt*> funcs; std::unordered_set<std::string> externs;\n',
                  '    std::unordered_map<std::string,Stmt*> funcs; std::unordered_set<std::string> externs; std::vector<std::string> native_symbols;\n')
          replace('src/jau_part03.inc',
                  '    std::string sym(const std::string&n)const{return "jau_fn_"+clean(n);}\n    std::string foreign_sym(const std::string&n)const{return clean(n);}\n',
                  '''    std::string sym(const std::string&n)const{return "jau_fn_"+clean(n);}\n    static std::string canonical_foreign(std::string n){\n        if(n.rfind("__imp_",0)==0)n=n.substr(6);else if(n.rfind("_imp__",0)==0)n=n.substr(6);\n        while(n.size()>1&&n[0]=='_')n.erase(n.begin());\n        auto at=n.find('@');if(at!=std::string::npos){bool digits=at+1<n.size();for(size_t i=at+1;i<n.size();++i)digits=digits&&std::isdigit((unsigned char)n[i]);if(digits)n=n.substr(0,at);}\n        return n;\n    }\n    std::string foreign_sym(const std::string&n)const{\n        std::string wanted=canonical_foreign(clean(n));\n        for(auto&actual:native_symbols)if(actual==clean(n))return actual;\n        std::string match;\n        for(auto&actual:native_symbols)if(canonical_foreign(actual)==wanted){if(!match.empty()&&match!=actual)return clean(n);match=actual;}\n        return match.empty()?clean(n):match;\n    }\n''')
          replace('src/jau_part03.inc',
                  '    AOT(std::string t,bool lib=false,int opt=0):target(std::move(t)),library(lib),optimize(opt){\n',
                  '    AOT(std::string t,bool lib=false,int opt=0,const std::vector<std::string>&ns={}):target(std::move(t)),library(lib),optimize(opt),native_symbols(ns){\n')
          replace('src/jau_part03.inc',
                  'Result run_source(const std::string&input,const CompileOptions&o,const std::vector<std::string>&args){try{g_runtime_args=args;VM vm(compile_program(input,o));vm.run();return {true,""};}catch(const std::exception&e){return {false,e.what()};}}\n',
                  'Result run_source(const std::string&input,const CompileOptions&o,const std::vector<std::string>&args){try{g_runtime_args=args;VM vm(compile_program(input,o),o.debug);vm.run();return {true,""};}catch(const std::exception&e){return {false,e.what()};}}\n')
          replace('src/jau_part03.inc',
                  'Result emit_assembly(const std::string&input,const std::string&output,const std::string&target,const CompileOptions&o){try{auto ast=parse_file(input,o);AOT a(target,o.library_mode,o.optimize);write_text(output,a.gen(ast));return {true,"assembly emitted: "+output+" ("+target+", O"+std::to_string(o.optimize)+")"};}catch(const std::exception&e){return {false,e.what()};}}\n',
                  'Result emit_assembly(const std::string&input,const std::string&output,const std::string&target,const CompileOptions&o){try{auto ast=parse_file(input,o);AOT a(target,o.library_mode,o.optimize,o.native_symbols);write_text(output,a.gen(ast));return {true,"assembly emitted: "+output+" ("+target+", O"+std::to_string(o.optimize)+")"};}catch(const std::exception&e){return {false,e.what()};}}\n')
          replace('src/jau_part03.inc','std::string version(){return "0.7.1";}','std::string version(){return "0.8.0";}')

          # jauc: scan COFF exports, feed them into AOT, robust native package detection, debug diagnostics.
          p=Path('src/jauc_main.cpp'); s=p.read_text(encoding='utf-8')
          anchor='static std::string read_text(const fs::path&p){std::ifstream f(p,std::ios::binary);if(!f)return "";std::ostringstream s;s<<f.rdbuf();return s.str();}\n'
          scanner=r'''static uint16_t coff16(const std::string&b,size_t p){if(p+2>b.size())throw std::runtime_error("truncated COFF");return (uint16_t)((unsigned char)b[p]|((unsigned char)b[p+1]<<8));}\nstatic uint32_t coff32(const std::string&b,size_t p){if(p+4>b.size())throw std::runtime_error("truncated COFF");return (uint32_t)(unsigned char)b[p]|((uint32_t)(unsigned char)b[p+1]<<8)|((uint32_t)(unsigned char)b[p+2]<<16)|((uint32_t)(unsigned char)b[p+3]<<24);}\nstatic std::string coff_name8(const std::string&b,size_t p){size_t n=0;while(n<8&&p+n<b.size()&&b[p+n])++n;return b.substr(p,n);}\nstatic std::vector<std::string> coff_defined_symbols(const fs::path&p){\n    std::string b=read_text(p);std::vector<std::string> out;if(b.size()<20)return out;uint32_t sp=coff32(b,8),ns=coff32(b,12);size_t strbase=(size_t)sp+(size_t)ns*18u;if(sp==0||strbase>b.size())return out;\n    auto str_at=[&](uint32_t off){if(off<4||strbase+off>=b.size())return std::string();size_t q=strbase+off,e=q;while(e<b.size()&&b[e])++e;return b.substr(q,e-q);};\n    for(uint32_t i=0;i<ns;){size_t q=(size_t)sp+(size_t)i*18u;if(q+18>b.size())break;uint32_t z=coff32(b,q);std::string name=z==0?str_at(coff32(b,q+4)):coff_name8(b,q);int16_t sec=(int16_t)coff16(b,q+12);uint8_t storage=(uint8_t)b[q+16],aux=(uint8_t)b[q+17];if(sec>0&&storage==2&&!name.empty())out.push_back(name);i+=1u+aux;}\n    return out;\n}\n'''.replace('\\n','\n')
          if 'coff_defined_symbols' not in s:
              if anchor not in s: raise SystemExit('jauc read_text anchor missing')
              s=s.replace(anchor,anchor+scanner,1)
          s=s.replace('    std::vector<std::string> objects;\n    int serial=0;','    std::vector<std::string> objects;\n    std::vector<std::string> symbols;\n    int serial=0;',1)
          old='''        std::string mf=jau::package_manifest(archive.string());std::string type=lower_copy_local(manifest_value(mf,"type"));\n        if(type=="native"){\n            std::string members=manifest_value(mf,native_key(target));if(members.empty())members=manifest_value(mf,"native");\n            if(members.empty())throw std::runtime_error("native package "+name+" has no object for target "+target);\n            for(auto&member:split_csv(members)){\n                auto ext=lower_copy_local(fs::path(member).extension().string());\n                if(ext!=".obj"&&ext!=".o")throw std::runtime_error("native package "+name+" member is not an object file: "+member);\n                std::string bytes=jau::package_read_file(archive.string(),member);\n                fs::path p=temp/("pkg_"+std::to_string(serial++)+"_"+fs::path(member).filename().string());\n                write_binary(p,bytes);objects.push_back(p.string());\n            }\n        }'''
          new='''        std::string mf=jau::package_manifest(archive.string());std::string type=lower_copy_local(manifest_value(mf,"type"));\n        std::string members=manifest_value(mf,native_key(target));if(members.empty())members=manifest_value(mf,"native");\n        bool native_pkg=(type=="native"||!members.empty());\n        if(native_pkg){\n            if(members.empty())throw std::runtime_error("native package "+name+" has no object for target "+target+"; expected manifest key "+native_key(target));\n            for(auto&member:split_csv(members)){\n                auto ext=lower_copy_local(fs::path(member).extension().string());\n                if(ext!=".obj"&&ext!=".o")throw std::runtime_error("native package "+name+" member is not an object file: "+member);\n                std::string bytes=jau::package_read_file(archive.string(),member);\n                fs::path p=temp/("pkg_"+std::to_string(serial++)+"_"+fs::path(member).filename().string());\n                write_binary(p,bytes);objects.push_back(p.string());\n                auto syms=coff_defined_symbols(p);symbols.insert(symbols.end(),syms.begin(),syms.end());\n            }\n        }'''
          if old in s:s=s.replace(old,new,1)
          elif 'bool native_pkg=(type=="native"||!members.empty())' not in s:raise SystemExit('NativeCollector native block anchor missing')
          old='static std::vector<std::string> collect_native_package_objects(const std::string& input,const std::string& target,const fs::path&temp,const jau::CompileOptions&opt){NativeCollector c{target,temp,opt};c.file(input);return c.objects;}\n'
          new='static std::vector<std::string> collect_native_package_objects(const std::string& input,const std::string& target,const fs::path&temp,const jau::CompileOptions&opt,std::vector<std::string>*symbols=nullptr){NativeCollector c{target,temp,opt};c.file(input);if(symbols)*symbols=c.symbols;return c.objects;}\n'
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('collector function anchor missing')

          # helper used by asm/obj to inspect native package objects before AOT emission
          helper=r'''static void append_unique(std::vector<std::string>&dst,const std::vector<std::string>&src){for(auto&s:src)if(std::find(dst.begin(),dst.end(),s)==dst.end())dst.push_back(s);}\nstatic jau::Result emit_with_native_symbols(const std::string&input,const std::string&output,const std::string&target,jau::CompileOptions opt){\n    if(!is_windows_target(target))return jau::emit_assembly(input,output,target,opt);\n    fs::path tmp=fs::temp_directory_path()/("jau_symbols_"+std::to_string(std::hash<std::string>{}(input+target)));std::error_code ec;fs::remove_all(tmp,ec);fs::create_directories(tmp);\n    try{std::vector<std::string> syms;auto objs=collect_native_package_objects(input,target,tmp,opt,&syms);for(auto&x:opt.native_inputs){auto e=lower_ext(x);if(e==".obj"||e==".o")append_unique(syms,coff_defined_symbols(x));}append_unique(opt.native_symbols,syms);if(opt.debug){std::cerr<<"[jauc:resolve] native objects="<<objs.size()<<" symbols="<<syms.size()<<"\\n";for(auto&o:objs)std::cerr<<"[jauc:object] "<<o<<"\\n";for(auto&z:syms)std::cerr<<"[jauc:symbol] "<<z<<"\\n";}auto r=jau::emit_assembly(input,output,target,opt);fs::remove_all(tmp,ec);return r;}catch(const std::exception&e){fs::remove_all(tmp,ec);return {false,std::string("native symbol discovery failed: ")+e.what()};}\n}\n'''.replace('\\n','\n')
          marker='static bool compile_native_input(const std::string& src,const std::string& target,const fs::path& out){\n'
          if 'emit_with_native_symbols' not in s:
              if marker not in s:raise SystemExit('compile_native_input marker missing')
              s=s.replace(marker,helper+marker,1)

          # Reorder Windows native build: collect package objects and symbols before AOT.
          old='''        fs::path tmp=fs::temp_directory_path()/("jau_native_"+std::to_string(std::hash<std::string>{}(input+output+target)));std::error_code ec;fs::remove_all(tmp,ec);fs::create_directories(tmp);\n        fs::path asmp=tmp/"app.s",obj=tmp/"app.obj";opt.library_mode=false;auto r=jau::emit_assembly(input,asmp.string(),target,opt);if(!r.ok){fs::remove_all(tmp,ec);return r;}\n        if(run_process(assembler,{asmp.string(),"-o",obj.string(),"--target",target,"--object"})!=0){fs::remove_all(tmp,ec);return {false,"internal jauas object build failed"};}\n        std::vector<std::string> objs{obj.string()};auto pkg=collect_native_package_objects(input,target,tmp,opt);objs.insert(objs.end(),pkg.begin(),pkg.end());int serial=0;'''
          new='''        fs::path tmp=fs::temp_directory_path()/("jau_native_"+std::to_string(std::hash<std::string>{}(input+output+target)));std::error_code ec;fs::remove_all(tmp,ec);fs::create_directories(tmp);\n        std::vector<std::string> discovered;auto pkg=collect_native_package_objects(input,target,tmp,opt,&discovered);for(auto&x:opt.native_inputs){auto e=lower_ext(x);if(e==".obj"||e==".o")append_unique(discovered,coff_defined_symbols(x));}append_unique(opt.native_symbols,discovered);\n        if(opt.debug){std::cerr<<"[jauc:resolve] target="<<target<<" package_objects="<<pkg.size()<<" native_symbols="<<discovered.size()<<"\\n";for(auto&p:pkg)std::cerr<<"[jauc:object] "<<p<<"\\n";for(auto&z:discovered)std::cerr<<"[jauc:symbol] "<<z<<"\\n";}\n        fs::path asmp=tmp/"app.s",obj=tmp/"app.obj";opt.library_mode=false;auto r=jau::emit_assembly(input,asmp.string(),target,opt);if(!r.ok){fs::remove_all(tmp,ec);return {false,"AOT stage: "+r.message};}\n        if(run_process(assembler,{asmp.string(),"-o",obj.string(),"--target",target,"--object"})!=0){fs::remove_all(tmp,ec);return {false,"assembler stage: internal jauas object build failed"};}\n        std::vector<std::string> objs{obj.string()};objs.insert(objs.end(),pkg.begin(),pkg.end());int serial=0;'''
          if old in s:s=s.replace(old,new,1)
          elif 'package_objects=' not in s:raise SystemExit('windows_native_build reorder anchor missing')
          s=s.replace('if(rc!=0)return {false,"internal jauld PE link failed"};return {true,"native executable built without external linker: "+output};',
                      'if(rc!=0)return {false,"link stage: internal jauld PE link failed (rerun with --debug to list package objects/symbols)"};return {true,"native executable built without external linker: "+output};',1)

          # diagnostics helpers
          diag=r'''static void print_diagnostic(const std::string&input,const std::string&stage,const std::string&message){\n    std::cerr<<"jauc["<<stage<<"]: "<<message<<"\\n";std::smatch m;std::regex re("(?:at |line )line? ?([0-9]+)|line ([0-9]+)");if(std::regex_search(message,m,re)){std::string n=m[1].matched?m[1].str():m[2].str();try{int ln=std::stoi(n);std::ifstream f(input);std::string line;for(int i=1;i<=ln&&std::getline(f,line);++i)if(i==ln){std::cerr<<"  --> "<<input<<":"<<ln<<"\\n  "<<ln<<" | "<<line<<"\\n";break;}}catch(...){}}\n}\n'''.replace('\\n','\n')
          if 'print_diagnostic' not in s:
              s=s.replace('static void help() {\n',diag+'static void help() {\n',1)
          s=s.replace('              << "  jauc run <file.jau>\\n"\n', '              << "  jauc run <file.jau>\\n"\n              << "  jauc debug <file.jau> [-- args...]\\n"\n              << "  jauc check <file.jau> [--target <target>]\\n"\n',1)
          s=s.replace('int main(int argc, char** argv) {','static int jauc_main_impl(int argc, char** argv) {',1)
          s=s.replace('else if (a == "--library") opt.library_mode = true;', 'else if (a == "--library") opt.library_mode = true; else if (a == "--debug") opt.debug = true;',1)
          s=s.replace('    if (cmd == "run") r = jau::run_source(input, opt, runargs);\n', '    if (cmd == "run") r = jau::run_source(input, opt, runargs);\n    else if (cmd == "debug") { opt.debug=true; r = jau::run_source(input,opt,runargs); }\n    else if (cmd == "check") { fs::path tmp=fs::temp_directory_path()/("jau_check_"+std::to_string(std::hash<std::string>{}(input+target))+(target.empty()?".jbc":".s")); if(target.empty())r=jau::compile_file(input,tmp.string(),opt);else r=emit_with_native_symbols(input,tmp.string(),target,opt);std::error_code ec;fs::remove(tmp,ec);if(r.ok)r={true,"check passed: "+input}; }\n',1)
          s=s.replace('else if (cmd == "asm") { if (output.empty()) output = "out.s"; if (target.empty()) target = "linux-x86_64"; r = jau::emit_assembly(input, output, target, opt); }', 'else if (cmd == "asm") { if (output.empty()) output = "out.s"; if (target.empty()) target = "linux-x86_64"; r = emit_with_native_symbols(input, output, target, opt); }',1)
          s=s.replace('r = jau::emit_assembly(input, temp.string(), target, opt); if (r.ok)', 'r = emit_with_native_symbols(input, temp.string(), target, opt); if (r.ok)',1)
          s=s.replace('    if (!r.ok) { std::cerr << "jauc: " << r.message << "\\n"; return 1; } if (!r.message.empty()) std::cout << r.message << "\\n"; return 0;\n}', '    if (!r.ok) { print_diagnostic(input,cmd,r.message); return 1; } if (!r.message.empty()) std::cout << r.message << "\\n"; return 0;\n}\n\nint main(int argc,char**argv){try{return jauc_main_impl(argc,argv);}catch(const std::exception&e){std::cerr<<"jauc[fatal]: "<<e.what()<<"\\n";return 1;}catch(...){std::cerr<<"jauc[fatal]: unknown internal error\\n";return 1;}}',1)
          p.write_text(s,encoding='utf-8')

          # jauld: canonical COFF symbol resolution across MSVC/MinGW decoration styles.
          p=Path('src/jauld_part01.inc'); s=p.read_text(encoding='utf-8')
          s=s.replace('    if(!n.empty()&&n[0]==\'_\')n.erase(n.begin());','    while(n.size()>1&&n[0]==\'_\')n.erase(n.begin());',1)
          p.write_text(s,encoding='utf-8')
          p=Path('src/jauld_part02.inc'); s=p.read_text(encoding='utf-8')
          anchor='''    auto it=st.globals.find(s.name);if(it!=st.globals.end())return symbol_rva(st,it->second.obj,st.objs[it->second.obj].symbols[it->second.sym]);\n'''
          canon='''    auto it=st.globals.find(s.name);if(it!=st.globals.end())return symbol_rva(st,it->second.obj,st.objs[it->second.obj].symbols[it->second.sym]);\n    {std::string wanted=undecorate(s.name);DefRef*match=nullptr;std::string matched_name;for(auto&g:st.globals)if(undecorate(g.first)==wanted){if(match&&matched_name!=g.first)throw std::runtime_error("ambiguous decorated external symbol: "+s.name+" matches "+matched_name+" and "+g.first);match=&g.second;matched_name=g.first;}if(match)return symbol_rva(st,match->obj,st.objs[match->obj].symbols[match->sym]);}\n'''
          if canon not in s:
              if anchor not in s:raise SystemExit('jauld resolve anchor missing')
              s=s.replace(anchor,canon,1)
          old='    throw std::runtime_error("unresolved external symbol: "+s.name);\n'
          new='''    std::string avail;int shown=0;for(auto&g:st.globals){if(shown++>=12)break;if(!avail.empty())avail+=", ";avail+=g.first;}throw std::runtime_error("unresolved external symbol: "+s.name+(avail.empty()?std::string(""):std::string("; defined externals include: ")+avail)+". For C++ extensions export ABI functions with extern \\\"C\\\" or use --debug in jauc to inspect package symbols");\n'''
          if old in s:s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          replace('CMakeLists.txt','project(Jau VERSION 0.7.0 LANGUAGES CXX)','project(Jau VERSION 0.8.0 LANGUAGES CXX)')

          Path('tests/native_alias').mkdir(parents=True,exist_ok=True)
          Path('tests/native_alias/mathx.cpp').write_text('extern "C" long long _mx_add(long long a,long long b){return a+b;}\n',encoding='utf-8')
          Path('tests/native_alias/jau.pkg').write_text('name="MathAlias"\nversion="1.0.0"\nmain="src/main.jau"\ntype="native"\nnative_windows_x86_64="native/windows-x86_64/mathx.obj"\n',encoding='utf-8')
          Path('tests/native_alias/src').mkdir(parents=True,exist_ok=True)
          Path('tests/native_alias/src/main.jau').write_text('extern func mx_add(a:int,b:int):int;\nnamespace MathAlias { func add(a:int,b:int):int { return mx_add(a,b); } }\n',encoding='utf-8')
          Path('tests/native_alias_consumer.jau').write_text('import "pkg:MathAlias"\nlet answer = MathAlias.add[20,22];\nwhile (answer != 42) { }\n',encoding='utf-8')

          # Remove one-shot workflow from resulting tree.
          Path('.github/workflows/v080-core-upgrade.yml').unlink(missing_ok=True)
          '@ | Set-Content -Encoding utf8 patch_v080.py
          python patch_v080.py
          Remove-Item patch_v080.py
      - name: Build x64
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DJAU_ENABLE_ASM_FASTOPS=OFF
          cmake --build build --config Release --parallel 2
          if ((& .\build\Release\jauc.exe --version) -ne '0.8.0') { throw 'wrong Jau version' }
      - name: Test package COFF symbol discovery and AOT aliasing
        shell: pwsh
        run: |
          cmake -S tests\native_alias -B aliasbuild -A x64
          # No CMakeLists in fixture: compile directly with cl from VS environment exposed by runner.
          cl /nologo /c /EHsc tests\native_alias\mathx.cpp /Fo:mathx.obj
          New-Item -ItemType Directory -Force aliaspkg\src,aliaspkg\native\windows-x86_64 | Out-Null
          Copy-Item tests\native_alias\jau.pkg aliaspkg\jau.pkg
          Copy-Item tests\native_alias\src\main.jau aliaspkg\src\main.jau
          Copy-Item mathx.obj aliaspkg\native\windows-x86_64\mathx.obj
          $pm=(Resolve-Path .\build\Release\jaupm.exe).Path
          $jauc=(Resolve-Path .\build\Release\jauc.exe).Path
          Push-Location aliaspkg
          & $pm pack dist\MathAlias-1.0.0.jaux
          Pop-Location
          $env:JAU_HOME="$PWD\alias-home"
          & $pm install .\aliaspkg\dist\MathAlias-1.0.0.jaux
          & $jauc asm tests\native_alias_consumer.jau -o alias.s --target windows-x86_64 --debug 2> alias-debug.txt
          if (!(Select-String -Path alias.s -Pattern 'call _mx_add' -Quiet)) { Get-Content alias.s; throw 'AOT did not map mx_add to discovered _mx_add COFF symbol' }
          if (!(Select-String -Path alias-debug.txt -Pattern '\[jauc:symbol\] _mx_add' -Quiet)) { Get-Content alias-debug.txt; throw 'debugger did not report discovered native symbol' }
          & $jauc native tests\native_alias_consumer.jau -o alias.exe --target windows-x86_64 --debug
          $p=Start-Process .\alias.exe -PassThru
          if(!$p.WaitForExit(5000)){Stop-Process -Id $p.Id -Force;throw 'alias native executable hung'}
          if($p.ExitCode -ne 0){throw "alias native executable failed: $($p.ExitCode)"}
          & $jauc check tests\native_alias_consumer.jau --target windows-x86_64 --debug
      - name: Run existing x64 tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Commit upgrade
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Jau 0.8: resolve native package COFF symbols in AOT and add debug diagnostics"
          git push origin HEAD:main

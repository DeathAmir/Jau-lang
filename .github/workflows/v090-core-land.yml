name: v090-core-land
on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_v090_core.py'
      - '.github/workflows/v090-core-land.yml'
permissions:
  contents: write
jobs:
  validate-and-land:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Jau 0.9 core patch
        shell: pwsh
        run: python tools/patch_v090_core.py

      - name: Build Windows x64
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DJAU_ENABLE_ASM_FASTOPS=OFF
          cmake --build build --config Release --parallel 2
          $v = & .\build\Release\jauc.exe --version 2> jauc-banner.txt
          if ($v -ne '0.9.0') { throw "unexpected version: $v" }
          if (!(Select-String -Path jauc-banner.txt -Pattern 'DeathAmir Jau @ DeathAmir 2026 (C)' -SimpleMatch -Quiet)) { throw 'CLI copyright banner missing' }
          if (!(Test-Path .\build\Release\jaum.exe)) { throw 'jaum.exe was not built' }

      - name: Build Win32 API probe objects x64
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force nativeprobe64 -ErrorAction SilentlyContinue
          New-Item -ItemType Directory nativeprobe64 | Out-Null
          @'
          #include <windows.h>
          #include <cstdint>
          extern "C" std::intptr_t win_metric(){ return (std::intptr_t)GetSystemMetrics(0); }
          extern "C" std::intptr_t open_box(){ return (std::intptr_t)MessageBoxA(nullptr,"Jau","Jau",MB_OK); }
          '@ | Set-Content -Encoding utf8 nativeprobe64\probe.cpp
          @'
          cmake_minimum_required(VERSION 3.16)
          project(JauWinProbe LANGUAGES CXX)
          add_library(probe OBJECT probe.cpp)
          '@ | Set-Content -Encoding utf8 nativeprobe64\CMakeLists.txt
          cmake -S nativeprobe64 -B nativeprobe64\build -A x64
          cmake --build nativeprobe64\build --config Release --parallel 2
          $obj=Get-ChildItem nativeprobe64\build -Recurse -Filter probe.obj | Select-Object -First 1
          if(!$obj){throw 'probe.obj not generated'}
          Copy-Item $obj.FullName nativeprobe64\probe.obj
          @'
          extern func win_metric():int;
          func main(){
              let width = win_metric();
              if (width > 0) { print(1); } else { print(0); }
              return 0;
          }
          '@ | Set-Content -Encoding utf8 winprobe.jau

      - name: Resolve user32 with --system-lib x64
        shell: pwsh
        run: |
          & .\build\Release\jauc.exe native winprobe.jau -o winprobe.exe --target windows-x86_64 --link nativeprobe64\probe.obj --system-lib user32 --debug 2> resolve.txt
          if($LASTEXITCODE -ne 0){Get-Content resolve.txt;throw 'system-lib link failed'}
          $out=@(& .\winprobe.exe)
          if(($out -join ',') -ne '1'){throw "Win32 system-lib execution mismatch: $out"}
          if(!(Select-String -Path resolve.txt -Pattern '[jauc:system-lib] user32' -SimpleMatch -Quiet)){throw 'system library did not flow through jauc'}

      - name: Resolve explicit import without system library map
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force metric64 -ErrorAction SilentlyContinue
          New-Item -ItemType Directory metric64 | Out-Null
          @'
          #include <windows.h>
          #include <cstdint>
          extern "C" std::intptr_t win_metric(){ return (std::intptr_t)GetSystemMetrics(0); }
          '@ | Set-Content -Encoding utf8 metric64\metric.cpp
          @'
          cmake_minimum_required(VERSION 3.16)
          project(JauMetric LANGUAGES CXX)
          add_library(metric OBJECT metric.cpp)
          '@ | Set-Content -Encoding utf8 metric64\CMakeLists.txt
          cmake -S metric64 -B metric64\build -A x64
          cmake --build metric64\build --config Release --parallel 2
          $obj=Get-ChildItem metric64\build -Recurse -Filter metric.obj | Select-Object -First 1
          Copy-Item $obj.FullName metric64\metric.obj
          & .\build\Release\jauc.exe native winprobe.jau -o explicit.exe --target windows-x86_64 --link metric64\metric.obj --import GetSystemMetrics=user32.dll
          if($LASTEXITCODE -ne 0){throw 'explicit import link failed'}
          $out=@(& .\explicit.exe)
          if(($out -join ',') -ne '1'){throw "explicit import mismatch: $out"}

      - name: Native package manifest carries system library
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force pkgprobe,pkg-home -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force pkgprobe\src,pkgprobe\native\windows-x86_64 | Out-Null
          Copy-Item metric64\metric.obj pkgprobe\native\windows-x86_64\metric.obj
          @'
          name="WinProbe"
          version="1.0.0"
          main="src/main.jau"
          type="native"
          native_windows_x86_64="native/windows-x86_64/metric.obj"
          system_libs_windows="user32"
          '@ | Set-Content -Encoding utf8 pkgprobe\jau.pkg
          @'
          extern func win_metric():int;
          namespace WinProbe {
              func metric(){ return win_metric(); }
          }
          '@ | Set-Content -Encoding utf8 pkgprobe\src\main.jau
          $pm=(Resolve-Path .\build\Release\jaupm.exe).Path
          Push-Location pkgprobe
          & $pm pack dist\WinProbe-1.0.0.jaux
          if($LASTEXITCODE -ne 0){throw 'jaux pack failed'}
          Pop-Location
          $env:JAU_HOME="$PWD\pkg-home"
          & $pm install .\pkgprobe\dist\WinProbe-1.0.0.jaux
          @'
          import "pkg:WinProbe"
          func main(){
              let x=WinProbe.metric();
              if(x>0){print(1);}else{print(0);}
              return 0;
          }
          '@ | Set-Content -Encoding utf8 pkg-consumer.jau
          & .\build\Release\jauc.exe native pkg-consumer.jau -o pkg-consumer.exe --target windows-x86_64 --debug 2> pkg-debug.txt
          if($LASTEXITCODE -ne 0){Get-Content pkg-debug.txt;throw 'manifest system-lib native build failed'}
          if(!(Select-String -Path pkg-debug.txt -Pattern '[jauc:system-lib] user32' -SimpleMatch -Quiet)){throw 'package system_libs_windows was not propagated'}
          $out=@(& .\pkg-consumer.exe)
          if(($out -join ',') -ne '1'){throw "package probe mismatch: $out"}

      - name: Generated artifacts contain no tool copyright
        shell: pwsh
        run: |
          & .\build\Release\jauc.exe asm tests\v090_core.jau -o clean.s --target windows-x86_64
          if(Select-String -Path clean.s -Pattern 'DeathAmir Jau @ DeathAmir 2026 (C)' -SimpleMatch -Quiet){throw 'generated assembly still contains tool copyright'}
          & .\build\Release\jauc.exe native tests\v090_core.jau -o clean.exe --target windows-x86_64
          $ascii=[Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Resolve-Path .\clean.exe)))
          if($ascii.Contains('DeathAmir Jau @ DeathAmir 2026 (C)')){throw 'generated native executable contains tool copyright'}
          & .\build\Release\jauc.exe standalone tests\v090_core.jau -o standalone.exe --runtime .\build\Release\jur.exe
          $stdout=@(& .\standalone.exe 2> standalone-stderr.txt)
          if(Select-String -Path standalone-stderr.txt -Pattern 'DeathAmir Jau @ DeathAmir 2026 (C)' -SimpleMatch -Quiet){throw 'bundled user program prints tool copyright'}
          if(($stdout -join ',') -ne '42'){throw "standalone output mismatch: $stdout"}

      - name: JauM project build x64
        shell: pwsh
        run: |
          Copy-Item tests\v090_jaum.txt jaum.txt
          & .\build\Release\jaum.exe build -f jaum.txt
          if($LASTEXITCODE -ne 0){throw 'jaum build failed'}
          if(!(Test-Path .\build-jaum\v090-windows-x86_64.exe)){throw 'JauM output missing'}
          $out=@(& .\build-jaum\v090-windows-x86_64.exe)
          if(($out -join ',') -ne '42'){throw "JauM output mismatch: $out"}

      - name: Build and validate Windows x86
        shell: pwsh
        run: |
          cmake -S . -B build32 -A Win32 -DJAU_ENABLE_ASM_FASTOPS=OFF
          cmake --build build32 --config Release --parallel 2
          Remove-Item -Recurse -Force metric32 -ErrorAction SilentlyContinue
          New-Item -ItemType Directory metric32 | Out-Null
          Copy-Item metric64\metric.cpp metric32\metric.cpp
          Copy-Item metric64\CMakeLists.txt metric32\CMakeLists.txt
          cmake -S metric32 -B metric32\build -A Win32
          cmake --build metric32\build --config Release --parallel 2
          $obj=Get-ChildItem metric32\build -Recurse -Filter metric.obj | Select-Object -First 1
          Copy-Item $obj.FullName metric32\metric.obj
          & .\build32\Release\jauc.exe native winprobe.jau -o winprobe32.exe --target windows-x86 --link metric32\metric.obj --system-lib user32
          if($LASTEXITCODE -ne 0){throw 'x86 system-lib link failed'}
          $out=@(& .\winprobe32.exe)
          if(($out -join ',') -ne '1'){throw "x86 system-lib execution mismatch: $out"}

      - name: Existing regression suite
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Commit validated Jau 0.9 core
        shell: pwsh
        run: |
          git rm tools/patch_v090_core.py .github/workflows/v090-core-land.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt include/jau/jau.hpp src/jau_part03.inc src/jur_main.cpp src/jauld_part00.inc src/jauld_part01.inc src/jauld_part02.inc src/jauld_part03.inc src/jauc_main.cpp src/jaum_main.cpp tests/v090_core.jau tests/v090_jaum.txt
          git commit -m "Jau 0.9: system libraries, clean artifacts and JauM"
          git push origin HEAD:main

name: v080-syntax-upgrade
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v080-syntax-upgrade.yml'
permissions:
  contents: write
jobs:
  syntax:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Add modern syntax
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def edit(path, old, new, count=1):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if new in s: return
              if old not in s: raise SystemExit(f'anchor missing: {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,count),encoding='utf-8')

          p=Path('src/jau_part01.inc'); s=p.read_text(encoding='utf-8')

          old='''enum class TK { End, Id, Num, Str, LParen,RParen,LBrace,RBrace,LBracket,RBracket,Comma,Semi,Colon,Dot,Plus,Minus,Star,Slash,Percent,Bang,Eq,Lt,Gt,EqEq,Ne,Le,Ge,AndAnd,OrOr,\n    Func,Extern,Namespace,If,Else,While,Return,Break,Continue,Let,Const,True,False,Null };'''
          new='''enum class TK { End, Id, Num, Str, LParen,RParen,LBrace,RBrace,LBracket,RBracket,Comma,Semi,Colon,Dot,Plus,Minus,Star,Slash,Percent,Bang,Eq,Lt,Gt,EqEq,Ne,Le,Ge,AndAnd,OrOr,\n    PlusEq,MinusEq,StarEq,SlashEq,PercentEq,Inc,Dec,Func,Extern,Namespace,If,Else,While,For,Return,Break,Continue,Let,Const,True,False,Null };'''
          if old in s:s=s.replace(old,new,1)
          elif 'PlusEq,MinusEq,StarEq' not in s:raise SystemExit('token enum anchor missing')

          old='''        if(peek()=='/'&&peek(1)=='/'){while(peek()&&peek()!='\\n')get();continue;}\n        if(peek()=='#'){while(peek()&&peek()!='\\n')get();continue;}'''
          new='''        if(peek()=='/'&&peek(1)=='/'){while(peek()&&peek()!='\\n')get();continue;}\n        if(peek()=='/'&&peek(1)=='*'){int start=line;get();get();while(peek()&&!(peek()=='*'&&peek(1)=='/'))get();if(!peek())throw Error("unterminated block comment starting at line "+std::to_string(start));get();get();continue;}\n        if(peek()=='#'){while(peek()&&peek()!='\\n')get();continue;}'''
          if old in s:s=s.replace(old,new,1)
          elif 'unterminated block comment starting' not in s:raise SystemExit('comment anchor missing')

          old='''            static const std::unordered_map<std::string,TK> kw={{"func",TK::Func},{"extern",TK::Extern},{"namespace",TK::Namespace},{"if",TK::If},{"else",TK::Else},{"while",TK::While},{"return",TK::Return},{"break",TK::Break},{"continue",TK::Continue},{"let",TK::Let},{"const",TK::Const},{"true",TK::True},{"false",TK::False},{"null",TK::Null}};'''
          new='''            static const std::unordered_map<std::string,TK> kw={{"func",TK::Func},{"fn",TK::Func},{"extern",TK::Extern},{"namespace",TK::Namespace},{"if",TK::If},{"else",TK::Else},{"while",TK::While},{"for",TK::For},{"return",TK::Return},{"break",TK::Break},{"continue",TK::Continue},{"let",TK::Let},{"var",TK::Let},{"const",TK::Const},{"true",TK::True},{"false",TK::False},{"null",TK::Null}};'''
          if old in s:s=s.replace(old,new,1)
          elif '{"fn",TK::Func}' not in s:raise SystemExit('keyword anchor missing')

          old="""        if(two('=','=',TK::EqEq)||two('!','=',TK::Ne)||two('<','=',TK::Le)||two('>','=',TK::Ge)||two('&','&',TK::AndAnd)||two('|','|',TK::OrOr))continue;"""
          new="""        if(two('=','=',TK::EqEq)||two('!','=',TK::Ne)||two('<','=',TK::Le)||two('>','=',TK::Ge)||two('&','&',TK::AndAnd)||two('|','|',TK::OrOr)||two('+','=',TK::PlusEq)||two('-','=',TK::MinusEq)||two('*','=',TK::StarEq)||two('/','=',TK::SlashEq)||two('%','=',TK::PercentEq)||two('+','+',TK::Inc)||two('-','-',TK::Dec))continue;"""
          if old in s:s=s.replace(old,new,1)
          elif "TK::PlusEq" not in s.split('get(); TK k;')[0]:raise SystemExit('two-char operator anchor missing')

          old='''struct Stmt { enum K{ExprS,VarS,Block,IfS,WhileS,ReturnS,BreakS,ContinueS,FuncS} k; std::string name; bool constant=false, external=false; std::unique_ptr<Expr> expr,cond; std::vector<std::unique_ptr<Stmt>> body,else_body; std::vector<std::string> params; };'''
          new='''struct Stmt { enum K{ExprS,VarS,Block,IfS,WhileS,ForS,ReturnS,BreakS,ContinueS,FuncS} k; std::string name; bool constant=false, external=false; std::unique_ptr<Expr> expr,cond,step; std::unique_ptr<Stmt> init; std::vector<std::unique_ptr<Stmt>> body,else_body; std::vector<std::string> params; };'''
          if old in s:s=s.replace(old,new,1)
          elif 'ForS' not in s:raise SystemExit('Stmt anchor missing')

          old='''    std::unique_ptr<Expr> call(){auto e=primary();for(;;){if(eat(TK::LParen)){auto c=std::make_unique<Expr>();c->k=Expr::Call;c->a=std::move(e);if(!at(TK::RParen)){do{c->args.push_back(expr());}while(eat(TK::Comma));}need(TK::RParen,"expected )");e=std::move(c);continue;}if(eat(TK::LBracket)){if(e->k==Expr::Var&&e->text.find('.')!=std::string::npos){auto c=std::make_unique<Expr>();c->k=Expr::Call;c->a=std::move(e);if(!at(TK::RBracket)){do{c->args.push_back(expr());}while(eat(TK::Comma));}need(TK::RBracket,"expected ]");e=std::move(c);}else{auto n=std::make_unique<Expr>();n->k=Expr::Index;n->a=std::move(e);n->b=expr();need(TK::RBracket,"expected ]");e=std::move(n);}continue;}break;}return e;}\n    std::unique_ptr<Expr> unary(){if(at(TK::Bang)||at(TK::Minus)){std::string op=cur().text;++i;auto e=std::make_unique<Expr>();e->k=Expr::Unary;e->text=op;e->a=unary();return e;}return call();}'''
          new='''    std::unique_ptr<Expr> update_expr(std::unique_ptr<Expr> base,bool inc){if(!base||base->k!=Expr::Var)throw Error("++/-- requires a variable at line "+std::to_string(cur().line));std::string n=base->text;auto lhs=std::make_unique<Expr>();lhs->k=Expr::Var;lhs->text=n;auto one=std::make_unique<Expr>();one->k=Expr::Lit;one->v=(int64_t)1;auto b=std::make_unique<Expr>();b->k=Expr::Binary;b->text=inc?"+":"-";b->a=std::move(lhs);b->b=std::move(one);auto a=std::make_unique<Expr>();a->k=Expr::Assign;a->text=n;a->a=std::move(b);return a;}\n    std::unique_ptr<Expr> call(){auto e=primary();for(;;){if(eat(TK::LParen)){auto c=std::make_unique<Expr>();c->k=Expr::Call;c->a=std::move(e);if(!at(TK::RParen)){do{c->args.push_back(expr());}while(eat(TK::Comma));}need(TK::RParen,"expected )");e=std::move(c);continue;}if(eat(TK::LBracket)){if(e->k==Expr::Var&&e->text.find('.')!=std::string::npos){auto c=std::make_unique<Expr>();c->k=Expr::Call;c->a=std::move(e);if(!at(TK::RBracket)){do{c->args.push_back(expr());}while(eat(TK::Comma));}need(TK::RBracket,"expected ]");e=std::move(c);}else{auto n=std::make_unique<Expr>();n->k=Expr::Index;n->a=std::move(e);n->b=expr();need(TK::RBracket,"expected ]");e=std::move(n);}continue;}if(at(TK::Inc)||at(TK::Dec)){bool inc=eat(TK::Inc);if(!inc)need(TK::Dec,"expected --");e=update_expr(std::move(e),inc);continue;}break;}return e;}\n    std::unique_ptr<Expr> unary(){if(at(TK::Inc)||at(TK::Dec)){bool inc=eat(TK::Inc);if(!inc)need(TK::Dec,"expected --");return update_expr(call(),inc);}if(at(TK::Bang)||at(TK::Minus)){std::string op=cur().text;++i;auto e=std::make_unique<Expr>();e->k=Expr::Unary;e->text=op;e->a=unary();return e;}return call();}'''
          if old in s:s=s.replace(old,new,1)
          elif 'update_expr' not in s:raise SystemExit('call/unary anchor missing')

          old='''    std::unique_ptr<Expr> assign(){auto e=lor();if(eat(TK::Eq)){if(e->k!=Expr::Var)throw Error("invalid assignment target");auto n=std::make_unique<Expr>();n->k=Expr::Assign;n->text=e->text;n->a=assign();return n;}return e;}'''
          new='''    std::unique_ptr<Expr> assign(){auto e=lor();if(at(TK::Eq)||at(TK::PlusEq)||at(TK::MinusEq)||at(TK::StarEq)||at(TK::SlashEq)||at(TK::PercentEq)){TK op=cur().k;++i;if(e->k!=Expr::Var)throw Error("assignment target must be a variable at line "+std::to_string(cur().line));std::string n=e->text;auto rhs=assign();auto a=std::make_unique<Expr>();a->k=Expr::Assign;a->text=n;if(op==TK::Eq)a->a=std::move(rhs);else{auto lhs=std::make_unique<Expr>();lhs->k=Expr::Var;lhs->text=n;auto b=std::make_unique<Expr>();b->k=Expr::Binary;b->text=op==TK::PlusEq?"+":op==TK::MinusEq?"-":op==TK::StarEq?"*":op==TK::SlashEq?"/":"%";b->a=std::move(lhs);b->b=std::move(rhs);a->a=std::move(b);}return a;}return e;}'''
          if old in s:s=s.replace(old,new,1)
          elif 'TK::PlusEq' not in s[s.find('std::unique_ptr<Expr> assign'):]:raise SystemExit('assign anchor missing')

          p.write_text(s,encoding='utf-8')

          # C-style for loop parser.
          p=Path('src/jau_part02a.inc'); s=p.read_text(encoding='utf-8')
          anchor='''        if(eat(TK::While)){auto s=std::make_unique<Stmt>();s->k=Stmt::WhileS;need(TK::LParen,"expected (");s->cond=expr();need(TK::RParen,"expected )");s->body=block_body();return s;}'''
          repl='''        if(eat(TK::While)){auto s=std::make_unique<Stmt>();s->k=Stmt::WhileS;need(TK::LParen,"expected (");s->cond=expr();need(TK::RParen,"expected )");s->body=block_body();return s;}\n        if(eat(TK::For)){auto s=std::make_unique<Stmt>();s->k=Stmt::ForS;need(TK::LParen,"expected ( after for");if(eat(TK::Semi)){}else if(at(TK::Let)||at(TK::Const)){bool con=eat(TK::Let)?false:(eat(TK::Const),true);auto q=std::make_unique<Stmt>();q->k=Stmt::VarS;q->constant=con;q->name=need(TK::Id,"expected for variable").text;skip_type_annotation();if(eat(TK::Eq))q->expr=expr();else{q->expr=std::make_unique<Expr>();q->expr->k=Expr::Lit;}need(TK::Semi,"expected ; after for initializer");s->init=std::move(q);}else{auto q=std::make_unique<Stmt>();q->k=Stmt::ExprS;q->expr=expr();need(TK::Semi,"expected ; after for initializer");s->init=std::move(q);}if(at(TK::Semi)){s->cond=std::make_unique<Expr>();s->cond->k=Expr::Lit;s->cond->v=true;}else s->cond=expr();need(TK::Semi,"expected ; after for condition");if(!at(TK::RParen))s->step=expr();need(TK::RParen,"expected ) after for clauses");s->body=block_body();return s;}'''
          if anchor in s:s=s.replace(anchor,repl,1)
          elif 'Stmt::ForS' not in s:raise SystemExit('while parser anchor missing')

          old='''    for(auto&s:v){optimize_expr(s->expr.get());optimize_expr(s->cond.get());optimize_stmts(s->body);optimize_stmts(s->else_body);'''
          new='''    for(auto&s:v){optimize_expr(s->expr.get());optimize_expr(s->cond.get());optimize_expr(s->step.get());if(s->init)optimize_expr(s->init->expr.get());optimize_stmts(s->body);optimize_stmts(s->else_body);'''
          if old in s:s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Bytecode for-loop with continue routed through the step expression.
          p=Path('src/jau_part02b.inc'); s=p.read_text(encoding='utf-8')
          anchor='''        case Stmt::WhileS:{int start=(int)f->code.size();break_jumps.push_back({});continue_jumps.push_back({});ex(s->cond.get());int jf=jump(Op::JumpFalse);emit(Op::Pop);for(auto&x:s->body)st(x.get());for(int j:continue_jumps.back())f->code[j].a=start;emit(Op::Jump,start);patch(jf);emit(Op::Pop);int end=(int)f->code.size();for(int j:break_jumps.back())f->code[j].a=end;break_jumps.pop_back();continue_jumps.pop_back();break;}'''
          repl='''        case Stmt::WhileS:{int start=(int)f->code.size();break_jumps.push_back({});continue_jumps.push_back({});ex(s->cond.get());int jf=jump(Op::JumpFalse);emit(Op::Pop);for(auto&x:s->body)st(x.get());for(int j:continue_jumps.back())f->code[j].a=start;emit(Op::Jump,start);patch(jf);emit(Op::Pop);int end=(int)f->code.size();for(int j:break_jumps.back())f->code[j].a=end;break_jumps.pop_back();continue_jumps.pop_back();break;}\n        case Stmt::ForS:{if(s->init)st(s->init.get());int start=(int)f->code.size();break_jumps.push_back({});continue_jumps.push_back({});ex(s->cond.get());int jf=jump(Op::JumpFalse);emit(Op::Pop);for(auto&x:s->body)st(x.get());int step=(int)f->code.size();for(int j:continue_jumps.back())f->code[j].a=step;if(s->step){ex(s->step.get());emit(Op::Pop);}emit(Op::Jump,start);patch(jf);emit(Op::Pop);int end=(int)f->code.size();for(int j:break_jumps.back())f->code[j].a=end;break_jumps.pop_back();continue_jumps.pop_back();break;}'''
          if anchor in s:s=s.replace(anchor,repl,1)
          elif 'case Stmt::ForS' not in s:raise SystemExit('BC while anchor missing')
          p.write_text(s,encoding='utf-8')

          # Native AOT for-loop.
          p=Path('src/jau_part03.inc'); s=p.read_text(encoding='utf-8')
          anchor='''        else if(s->k==Stmt::WhileS){std::string a=L(),b=L();c.continues.push_back(a);c.breaks.push_back(b);o<<a<<":\\n";ex(s->cond.get());pop(is64?"rax":"eax");o<<"  cmp "<<(is64?"rax":"eax")<<",0\\n  je "<<b<<"\\n";for(auto&x:s->body)st(x.get());o<<"  jmp "<<a<<"\\n"<<b<<":\\n";c.continues.pop_back();c.breaks.pop_back();}'''
          repl='''        else if(s->k==Stmt::WhileS){std::string a=L(),b=L();c.continues.push_back(a);c.breaks.push_back(b);o<<a<<":\\n";ex(s->cond.get());pop(is64?"rax":"eax");o<<"  cmp "<<(is64?"rax":"eax")<<",0\\n  je "<<b<<"\\n";for(auto&x:s->body)st(x.get());o<<"  jmp "<<a<<"\\n"<<b<<":\\n";c.continues.pop_back();c.breaks.pop_back();}\n        else if(s->k==Stmt::ForS){if(s->init)st(s->init.get());std::string a=L(),step=L(),b=L();c.continues.push_back(step);c.breaks.push_back(b);o<<a<<":\\n";ex(s->cond.get());pop(is64?"rax":"eax");o<<"  cmp "<<(is64?"rax":"eax")<<",0\\n  je "<<b<<"\\n";for(auto&x:s->body)st(x.get());o<<step<<":\\n";if(s->step){ex(s->step.get());o<<"  add "<<(is64?"rsp,8":"esp,4")<<"\\n";}o<<"  jmp "<<a<<"\\n"<<b<<":\\n";c.continues.pop_back();c.breaks.pop_back();}'''
          if anchor in s:s=s.replace(anchor,repl,1)
          elif 's->k==Stmt::ForS' not in s:raise SystemExit('AOT while anchor missing')
          p.write_text(s,encoding='utf-8')

          Path('tests/syntax_v08.jau').write_text(r'''/* Jau 0.8 syntax smoke test */
fn sum_to(n:int):int {
    var total:int = 0;
    for (var i:int = 0; i < n; i++) {
        if (i == 3) {
            continue;
        }
        total += i;
    }
    total -= 1;
    total++;
    return total;
}

var answer:int = sum_to(6);
print(answer);
''',encoding='utf-8')

          Path('.github/workflows/v080-syntax-upgrade.yml').unlink(missing_ok=True)
          '@ | Set-Content -Encoding utf8 patch_syntax.py
          python patch_syntax.py
          Remove-Item patch_syntax.py

      - name: Build and test VM syntax
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DJAU_ENABLE_ASM_FASTOPS=OFF
          cmake --build build --config Release --parallel 2
          $out = & .\build\Release\jauc.exe run tests\syntax_v08.jau
          if ($out -ne '12') { throw "VM syntax result mismatch: $out" }
          & .\build\Release\jauc.exe check tests\syntax_v08.jau

      - name: Test native syntax
        shell: pwsh
        run: |
          & .\build\Release\jauc.exe asm tests\syntax_v08.jau -o syntax-v08.s --target windows-x86_64
          & .\build\Release\jauc.exe native tests\syntax_v08.jau -o syntax-v08.exe --target windows-x86_64
          $out = & .\syntax-v08.exe
          if ($out -ne '12') { throw "native syntax result mismatch: $out" }

      - name: Existing regression suite
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Commit syntax upgrade
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand Jau 0.8 syntax with for loops updates aliases and block comments"
          git push origin HEAD:main

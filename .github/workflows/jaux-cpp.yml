name: jaux-cpp
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/native_extension/**'
      - 'tests/native_extension_consumer.jau'
      - 'tests/native_mathx/**'
      - 'tests/native_mathx_consumer.jau'
      - '.github/workflows/jaux-cpp.yml'
  workflow_dispatch:

jobs:
  mathx-x64:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build Jau x64
        run: |
          cmake -S . -B build -A x64 -DJAU_ENABLE_ASM_FASTOPS=OFF
          cmake --build build --config Release --parallel 2
      - name: Build MathX C++ COFF x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force mathsrc | Out-Null
          Copy-Item tests\native_mathx\mathx.cpp mathsrc\mathx.cpp
          @'
          cmake_minimum_required(VERSION 3.16)
          project(MathX LANGUAGES CXX)
          add_library(mathx OBJECT mathx.cpp)
          '@ | Set-Content -Encoding utf8 mathsrc\CMakeLists.txt
          cmake -S mathsrc -B mathbuild -A x64
          cmake --build mathbuild --config Release --parallel 2
          $obj=Get-ChildItem mathbuild -Recurse -Filter mathx.obj | Select-Object -First 1
          if(!$obj){ throw 'mathx.obj x64 missing' }
          New-Item -ItemType Directory -Force mathpkg\src,mathpkg\native\windows-x86_64 | Out-Null
          Copy-Item tests\native_mathx\jau.pkg mathpkg\jau.pkg
          Copy-Item tests\native_mathx\src\main.jau mathpkg\src\main.jau
          Copy-Item $obj.FullName mathpkg\native\windows-x86_64\mathx.obj
      - name: Pack resolve and run MathX x64
        shell: pwsh
        run: |
          $pm=(Resolve-Path .\build\Release\jaupm.exe).Path
          $jauc=(Resolve-Path .\build\Release\jauc.exe).Path
          Push-Location mathpkg
          & $pm pack dist\MathX-1.0.0.jaux
          & $pm verify dist\MathX-1.0.0.jaux
          Pop-Location
          $env:JAU_HOME="$PWD\math-home64"
          & $pm install .\mathpkg\dist\MathX-1.0.0.jaux
          & $jauc asm tests\native_mathx_consumer.jau -o mathx64.s --target windows-x86_64 --debug 2> mathx64-debug.txt
          if($LASTEXITCODE -ne 0){ Get-Content mathx64-debug.txt; throw 'MathX x64 AOT failed' }
          if(!(Select-String mathx64-debug.txt -Pattern '\[jauc:symbol\] mx_add' -Quiet)){ Get-Content mathx64-debug.txt; throw 'mx_add x64 not discovered' }
          if(!(Select-String mathx64.s -Pattern 'call mx_add' -Quiet)){ throw 'AOT x64 did not emit call mx_add' }
          & $jauc native tests\native_mathx_consumer.jau -o mathx64.exe --target windows-x86_64 --debug
          if($LASTEXITCODE -ne 0){ throw 'MathX x64 native compile failed' }
          $out=@(& .\mathx64.exe)
          if(($out -join ',') -ne '42,42,1024'){ throw "MathX x64 output mismatch: $out" }

  mathx-x86:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build Jau x86
        run: |
          cmake -S . -B build32 -A Win32 -DJAU_ENABLE_ASM_FASTOPS=OFF
          cmake --build build32 --config Release --parallel 2
      - name: Build MathX C++ COFF x86
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force mathsrc32 | Out-Null
          Copy-Item tests\native_mathx\mathx.cpp mathsrc32\mathx.cpp
          @'
          cmake_minimum_required(VERSION 3.16)
          project(MathX LANGUAGES CXX)
          add_library(mathx OBJECT mathx.cpp)
          '@ | Set-Content -Encoding utf8 mathsrc32\CMakeLists.txt
          cmake -S mathsrc32 -B mathbuild32 -A Win32
          cmake --build mathbuild32 --config Release --parallel 2
          $obj=Get-ChildItem mathbuild32 -Recurse -Filter mathx.obj | Select-Object -First 1
          if(!$obj){ throw 'mathx.obj x86 missing' }
          New-Item -ItemType Directory -Force mathpkg32\src,mathpkg32\native\windows-x86 | Out-Null
          Copy-Item tests\native_mathx\jau.pkg mathpkg32\jau.pkg
          Copy-Item tests\native_mathx\src\main.jau mathpkg32\src\main.jau
          Copy-Item $obj.FullName mathpkg32\native\windows-x86\mathx.obj
      - name: Pack resolve and run MathX x86
        shell: pwsh
        run: |
          $pm=(Resolve-Path .\build32\Release\jaupm.exe).Path
          $jauc=(Resolve-Path .\build32\Release\jauc.exe).Path
          Push-Location mathpkg32
          & $pm pack dist\MathX-1.0.0.jaux
          & $pm verify dist\MathX-1.0.0.jaux
          Pop-Location
          $env:JAU_HOME="$PWD\math-home32"
          & $pm install .\mathpkg32\dist\MathX-1.0.0.jaux
          & $jauc asm tests\native_mathx_consumer.jau -o mathx32.s --target windows-x86 --debug 2> mathx32-debug.txt
          if($LASTEXITCODE -ne 0){ Get-Content mathx32-debug.txt; throw 'MathX x86 AOT failed' }
          if(!(Select-String mathx32-debug.txt -Pattern '\[jauc:symbol\] _?mx_add' -Quiet)){ Get-Content mathx32-debug.txt; throw 'mx_add x86 not discovered' }
          & $jauc native tests\native_mathx_consumer.jau -o mathx32.exe --target windows-x86 --debug
          if($LASTEXITCODE -ne 0){ throw 'MathX x86 native compile failed' }
          $out=@(& .\mathx32.exe)
          if(($out -join ',') -ne '42,42,1024'){ throw "MathX x86 output mismatch: $out" }
